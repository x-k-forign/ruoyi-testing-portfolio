[pytest]
# tests 下按目录保存 YAML，唯一 Python 执行器与分组文件夹同级。
testpaths = tests/test_yaml_case.py
python_files = test_yaml_case.py
python_functions = test_yaml_case
pythonpath = .
norecursedirs = .git .venv .local .private .pytest_cache
addopts = -ra --tb=short --strict-markers --alluredir=data/temps --clean-alluredir

markers =
    auth: 授权变更与账号禁用
    user_access: 用户登录
    user_create: 用户创建与授权
    log: 相关日志核对
    menu_and_data: 菜单操作与数据访问
    interactive: 显式选择manual验证码模式时动态添加，需要人工输入
    assertion_copy: 断言失败练习副本，须显式选择--assertion-copy运行

log_file = logs/pytest.log
log_file_level = INFO
log_file_format = %(levelname)-8s %(asctime)s [%(name)s:%(lineno)s] : %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
result_log_enable = 1
result_log_separator = 1
result_log_level_separator = warning
result_log_level_verbose = info
