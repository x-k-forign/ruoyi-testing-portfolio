# 原用例：TC-M06-01
# 公共前置只准备专属数据；以下步骤执行目标业务并保留真实结果。
name: 禁用后旧A访问与新B登录拒绝的真实对照
mark:
- auth

steps:
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/system/user/list
      headers:
        Authorization: Bearer ${admin_token}
      pagination:
        page_size: 10
        max_pages: 100
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
  # 提取本次动态字段；pages表示已读完的真实分页结果
  - extract:
      before_rows:
      - pages
      - rows
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/system/user/list
      headers:
        Authorization: Bearer ${before_token}
      pagination:
        page_size: 2
        max_pages: 100
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
      user_ids:
        baseline: ${before_rows}
        departments:
        - ${dept_a}
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: PUT
      url: ${base_url}/system/user/changeStatus
      headers:
        Authorization: Bearer ${admin_token}
      json:
        userId: ${new_user_id}
        status: '1'
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/system/user/${new_user_id}
      headers:
        Authorization: Bearer ${admin_token}
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
        data:
          userId: ${new_user_id}
          status: '1'
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/system/user/list
      headers:
        Authorization: Bearer ${before_token}
      pagination:
        page_size: 2
        max_pages: 100
        allow_rejected: true
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      checkpoint:
        name: disabled_old_a
        pending: 用户确认禁用与旧会话下线时效尚未确定，保留真实A/B观察
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/captchaImage
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: POST
      url: ${base_url}/login
      json:
        username: ${new_username}
        password: ${new_password}
        code: ${captcha_code}
        uuid: ${captcha_uuid}
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 500
        msg: 用户已封禁，请联系管理员
      absent:
      - token
      - user
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      checkpoint:
        name: disabled_new_b
        code: 500
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      checkpoints:
      - disabled_old_a
      - disabled_new_b
