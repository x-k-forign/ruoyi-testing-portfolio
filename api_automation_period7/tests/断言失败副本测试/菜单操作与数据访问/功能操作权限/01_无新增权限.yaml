# 原用例：TC-C05-01
# T7.5：公共前置由夹具query_session提供；每例账号与会话独立，统一回查清理。
name: 已登录的查询用户无新增权限，拒绝后不产生账号
mark:
  - menu_and_data

steps:
  # 业务动作：POST /system/user
  - request:
      method: POST
      url: ${base_url}/system/user
      headers:
        Authorization: Bearer ${user_token}
      json:
        userName: ${denied_username}
        nickName: ${new_nickname}
        password: ${new_password}
        deptId: ${dept_id}
        roleIds:
          - ${role_id}
        postIds: ${post_ids}
        status: '0'
        sex: '2'
        remark: ${batch_tag}
  # 分别核对HTTP、业务字段及适用的写后状态
  - response:
      status_code: 200
      json:
        code: 403
        msg: 没有权限，请联系管理员授权
      owned_users: 1
  # 业务动作：GET /system/user/list
  - request:
      method: GET
      url: ${base_url}/system/user/list
      headers:
        Authorization: Bearer ${admin_token}
      params:
        userName: ${denied_username}
        pageNum: 1
        pageSize: 20
  # 分别核对HTTP、业务字段及适用的写后状态
  - response:
      status_code: 200
      json:
        code: 200
        total: 0
        rows: []
