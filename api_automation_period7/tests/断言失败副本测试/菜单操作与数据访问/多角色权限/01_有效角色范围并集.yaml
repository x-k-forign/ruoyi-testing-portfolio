# 原用例：TC-A11-01
# 公共前置只准备专属数据；以下步骤执行目标业务并保留真实结果。
name: 多角色均有效时范围合并正确，新增按授权部门获准
mark:
- menu_and_data

steps:
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/system/user/list
      headers:
        Authorization: Bearer ${admin_token}
      pagination:
        page_size: 10
        max_pages: 100
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
  # 提取本次动态字段；pages表示已读完的真实分页结果
  - extract:
      baseline_rows:
      - pages
      - rows
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/system/user/list
      headers:
        Authorization: Bearer ${before_token}
      pagination:
        page_size: 2
        max_pages: 100
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
      user_ids:
        baseline: ${baseline_rows}
        departments:
        - ${dept_a}
        - ${dept_b}
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: POST
      url: ${base_url}/system/user
      headers:
        Authorization: Bearer ${before_token}
      json:
        userName: ${allowed_username}
        nickName: ${new_nickname}
        password: ${new_password}
        deptId: ${dept_b}
        roleIds:
        - ${role_id}
        postIds: ${post_ids}
        status: '0'
        sex: '2'
        remark: ${batch_tag}
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/system/user/list
      headers:
        Authorization: Bearer ${admin_token}
      params:
        userName: ${allowed_username}
        pageNum: 1
        pageSize: 100
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
        total: 1
        rows:
        - userName: ${allowed_username}
          remark: ${batch_tag}
  # 提取本次动态字段；pages表示已读完的真实分页结果
  - extract:
      created_target_id:
      - json
      - $.rows[0].userId
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/system/user/${created_target_id}
      headers:
        Authorization: Bearer ${admin_token}
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
        data:
          userId: ${created_target_id}
          userName: ${allowed_username}
          deptId: ${dept_b}
          status: '0'
        roleIds:
        - ${role_id}
        postIds: ${post_ids}
