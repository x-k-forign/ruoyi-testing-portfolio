# 原用例：TC-L01-01
# T7.5：公共前置由夹具prepared_user提供；每例账号与会话独立，统一回查清理。
name: 新建用户登录身份正确，获准访问且退出后原令牌失效
mark:
  - user_access

steps:
  # 业务动作：GET /captchaImage
  - request:
      method: GET
      url: ${base_url}/captchaImage
  # 分别核对HTTP、业务字段及适用的写后状态
  - response:
      status_code: 200
      json:
        code: 200
  # 业务动作：POST /login
  - request:
      method: POST
      url: ${base_url}/login
      json:
        username: ${new_username}
        password: ${new_password}
        code: ${captcha_code}
        uuid: ${captcha_uuid}
  # 分别核对HTTP、业务字段及适用的写后状态
  - response:
      status_code: 200
      json:
        code: 200
      present:
        - token
  # 提取本次真实响应变量，后续请求动态关联
  - extract:
      user_token:
        - json
        - $.token
  # 业务动作：GET /getInfo
  - request:
      method: GET
      url: ${base_url}/getInfo
      headers:
        Authorization: Bearer ${user_token}
  # 分别核对HTTP、业务字段及适用的写后状态
  - response:
      status_code: 200
      json:
        code: 200
        user:
          userName: ${new_username}
          userId: ${new_user_id}
          deptId: ${dept_id}
      contains:
        $.permissions:
          - system:user:list
          - system:user:query
  # 业务动作：GET /system/user/list
  - request:
      method: GET
      url: ${base_url}/system/user/list
      headers:
        Authorization: Bearer ${user_token}
      params:
        userName: ${new_username}
        pageNum: 1
        pageSize: 20
  # 分别核对HTTP、业务字段及适用的写后状态
  - response:
      status_code: 200
      json:
        code: 200
        total: 1
        rows:
          - userName: ${new_username}
            remark: ${batch_tag}
  # 业务动作：POST /logout
  - request:
      method: POST
      url: ${base_url}/logout
      headers:
        Authorization: Bearer ${user_token}
  # 分别核对HTTP、业务字段及适用的写后状态
  - response:
      status_code: 200
      json:
        code: 200
  # 业务动作：GET /getInfo
  - request:
      method: GET
      url: ${base_url}/getInfo
      headers:
        Authorization: Bearer ${user_token}
  # 分别核对HTTP、业务字段及适用的写后状态
  - response:
      status_code: 200
      json:
        code: 401
      absent:
        - user
        - token
