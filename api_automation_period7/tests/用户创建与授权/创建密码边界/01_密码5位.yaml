# 原用例：TC-C09-01
# T7.5：公共前置由夹具creation_ready提供；每例账号与会话独立，统一回查清理。
# 已知BUG-T3-002：保留正确拒绝预期，失败不会跳过或改为通过。
name: 创建密码5位：应拒绝且不产生账号
mark:
  - user_create

steps:
  # 业务动作：POST /system/user
  - request:
      method: POST
      url: ${base_url}/system/user
      headers:
        Authorization: Bearer ${admin_token}
      json:
        userName: ${new_username}
        nickName: ${new_nickname}
        password: ${password_5}
        deptId: ${dept_id}
        roleIds:
          - ${role_id}
        postIds: ${post_ids}
        status: '0'
        sex: '2'
        remark: ${batch_tag}
  # 分别核对HTTP、业务字段及适用的写后状态
  - response:
      status_code: 200
      json:
        code: ${expected_business_code}
      owned_users: ${expected_owned_users}
  # 业务动作：GET /system/user/list
  - request:
      method: GET
      url: ${base_url}/system/user/list
      headers:
        Authorization: Bearer ${admin_token}
      params:
        userName: ${new_username}
        pageNum: 1
        pageSize: 20
  # 分别核对HTTP、业务字段及适用的写后状态
  - response:
      status_code: 200
      json:
        code: 200
        total: 0
        rows: []
