# 原用例：TC-A11-02
# 公共前置只准备专属数据；以下步骤执行目标业务并保留真实结果。
name: 附加角色停用后新登录仅保留有效角色范围与查询权限
mark:
- menu_and_data

steps:
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/system/user/list
      headers:
        Authorization: Bearer ${admin_token}
      pagination:
        page_size: 10
        max_pages: 100
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
  # 提取本次动态字段；pages表示已读完的真实分页结果
  - extract:
      before_rows:
      - pages
      - rows
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/system/user/list
      headers:
        Authorization: Bearer ${before_token}
      pagination:
        page_size: 2
        max_pages: 100
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
      user_ids:
        baseline: ${before_rows}
        departments:
        - ${dept_a}
        - ${dept_b}
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: PUT
      url: ${base_url}/system/role/changeStatus
      headers:
        Authorization: Bearer ${admin_token}
      json:
        roleId: ${extra_role_id}
        status: '1'
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/system/role/${extra_role_id}
      headers:
        Authorization: Bearer ${admin_token}
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
        data:
          roleId: ${extra_role_id}
          status: '1'
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/captchaImage
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: POST
      url: ${base_url}/login
      json:
        username: ${new_username}
        password: ${new_password}
        code: ${captcha_code}
        uuid: ${captcha_uuid}
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
      present:
      - token
  # 提取本次动态字段；pages表示已读完的真实分页结果
  - extract:
      after_token:
      - json
      - $.token
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/getInfo
      headers:
        Authorization: Bearer ${after_token}
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
        user:
          userId: ${new_user_id}
          userName: ${new_username}
          deptId: ${dept_id}
      contains:
        $.permissions:
        - system:user:list
        - system:user:query
      not_contains:
        $.permissions:
        - system:user:add
        - '*:*:*'
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/system/user/list
      headers:
        Authorization: Bearer ${admin_token}
      pagination:
        page_size: 10
        max_pages: 100
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
  # 提取本次动态字段；pages表示已读完的真实分页结果
  - extract:
      baseline_rows:
      - pages
      - rows
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/system/user/list
      headers:
        Authorization: Bearer ${after_token}
      pagination:
        page_size: 2
        max_pages: 100
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
      user_ids:
        baseline: ${baseline_rows}
        departments:
        - ${dept_a}
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: POST
      url: ${base_url}/system/user
      headers:
        Authorization: Bearer ${after_token}
      json:
        userName: ${denied_username}
        nickName: ${new_nickname}
        password: ${new_password}
        deptId: ${dept_a}
        roleIds:
        - ${role_id}
        postIds: ${post_ids}
        status: '0'
        sex: '2'
        remark: ${batch_tag}
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 403
  # 发送本步骤真实请求；Authorization明确选择身份
  - request:
      method: GET
      url: ${base_url}/system/user/list
      headers:
        Authorization: Bearer ${admin_token}
      params:
        userName: ${denied_username}
        pageNum: 1
        pageSize: 100
  # 核对响应、集合或已采集检查点，保留HTTP与业务结论的区别
  - response:
      status_code: 200
      json:
        code: 200
        total: 0
        rows: []
